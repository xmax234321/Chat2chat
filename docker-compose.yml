services:
  relay:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${PORT:-3847}:3847"
    environment:
      PORT: 3847
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
      MESSAGE_TTL_MS: ${MESSAGE_TTL_MS:-86400000}
      BLOB_TTL_MS: ${BLOB_TTL_MS:-86400000}
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-536870912}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3847/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      VITE_CHAT2CHAT_SERVER: ${VITE_CHAT2CHAT_SERVER:-ws://localhost:3847/ws}
    depends_on:
      relay:
        condition: service_healthy
    profiles:
      - full
