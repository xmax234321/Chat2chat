<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#dedbd4;font-family:'Hanken Grotesk',system-ui,sans-serif}
.sheet{width:1180px;margin:40px auto;display:flex;flex-direction:column;gap:22px}
.panel{border-radius:20px;padding:34px 38px;box-sizing:border-box}
.lbl{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.14em}
.mrow{display:flex;gap:22px}
.chip{flex:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:34px 0}
.wm{font-weight:600;letter-spacing:-.025em}
.wm b{font-weight:600}
</style>
</helmet>

<div class="sheet">

  <!-- HERO -->
  <div class="panel" style="background:#0B0B0C;display:flex;align-items:center;gap:46px">
    <!-- app icon -->
    <div style="width:184px;height:184px;border-radius:42px;background:#F4F4F3;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 20px 50px rgba(0,0,0,.4)">
      <svg viewBox="0 0 48 48" style="width:104px;height:104px;color:#0B0B0C">
        <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
        <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
        <circle cx="24" cy="28" r="3.1" fill="#F4F4F3"/>
        <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#F4F4F3"/>
      </svg>
    </div>
    <div>
      <div class="lbl" style="color:#5F5F5D;margin-bottom:16px">SECURE MESSENGER · IDENTITY</div>
      <div class="wm" style="font-size:58px;color:#F4F4F3;line-height:1">Chat<span style="color:#9C9C9A">2</span>Chat</div>
      <div style="font-size:17px;color:#9C9C9A;margin-top:16px;max-width:420px;line-height:1.5">Private by design. A lock and a message — the whole product in one mark.</div>
    </div>
  </div>

  <!-- LOGOMARK VARIANTS -->
  <div class="panel" style="background:#f4f2ee;border:1px solid rgba(0,0,0,.06)">
    <div class="lbl" style="color:rgba(0,0,0,.45);margin-bottom:22px">LOGOMARK</div>
    <div class="mrow">
      <!-- dark solid -->
      <div class="chip" style="background:#0B0B0C">
        <svg viewBox="0 0 48 48" style="width:78px;height:78px;color:#F4F4F3">
          <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
          <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
          <circle cx="24" cy="28" r="3.1" fill="#0B0B0C"/>
          <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#0B0B0C"/>
        </svg>
        <div class="lbl" style="color:#5F5F5D">REVERSED</div>
      </div>
      <!-- light solid -->
      <div class="chip" style="background:#F4F4F3;border:1px solid rgba(0,0,0,.08)">
        <svg viewBox="0 0 48 48" style="width:78px;height:78px;color:#0B0B0C">
          <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
          <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
          <circle cx="24" cy="28" r="3.1" fill="#F4F4F3"/>
          <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#F4F4F3"/>
        </svg>
        <div class="lbl" style="color:rgba(0,0,0,.4)">PRIMARY</div>
      </div>
      <!-- outline -->
      <div class="chip" style="background:#1B1B1E">
        <svg viewBox="0 0 48 48" style="width:78px;height:78px;color:#F4F4F3">
          <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <rect x="9" y="21" width="30" height="17" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.6"/>
          <path d="M14.5 38 L11.8 43 L20 38" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="24" cy="27.6" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M24 30.6 v3.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div class="lbl" style="color:#7A7A78">OUTLINE</div>
      </div>
    </div>
  </div>

  <!-- HORIZONTAL LOCKUPS -->
  <div class="panel" style="background:#f4f2ee;border:1px solid rgba(0,0,0,.06)">
    <div class="lbl" style="color:rgba(0,0,0,.45);margin-bottom:22px">HORIZONTAL LOCKUP</div>
    <div class="mrow">
      <div class="chip" style="background:#0B0B0C;flex-direction:row;gap:20px;padding:40px">
        <svg viewBox="0 0 48 48" style="width:52px;height:52px;color:#F4F4F3;flex:none">
          <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
          <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
          <circle cx="24" cy="28" r="3.1" fill="#0B0B0C"/>
          <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#0B0B0C"/>
        </svg>
        <div class="wm" style="font-size:34px;color:#F4F4F3">Chat<span style="color:#9C9C9A">2</span>Chat</div>
      </div>
      <div class="chip" style="background:#F4F4F3;border:1px solid rgba(0,0,0,.08);flex-direction:row;gap:20px;padding:40px">
        <svg viewBox="0 0 48 48" style="width:52px;height:52px;color:#0B0B0C;flex:none">
          <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
          <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
          <circle cx="24" cy="28" r="3.1" fill="#F4F4F3"/>
          <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#F4F4F3"/>
        </svg>
        <div class="wm" style="font-size:34px;color:#0B0B0C">Chat<span style="color:#9C9C9A">2</span>Chat</div>
      </div>
    </div>
  </div>

  <!-- APP ICON SIZES + FAVICON -->
  <div class="panel" style="background:#f4f2ee;border:1px solid rgba(0,0,0,.06)">
    <div class="lbl" style="color:rgba(0,0,0,.45);margin-bottom:22px">APP ICON · SIZES</div>
    <div style="display:flex;align-items:flex-end;gap:34px;background:#0B0B0C;border-radius:16px;padding:36px 40px">
      <!-- 128 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="width:112px;height:112px;border-radius:26px;background:#F4F4F3;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 48 48" style="width:64px;height:64px;color:#0B0B0C">
            <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
            <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
            <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="3.1" fill="#F4F4F3"/>
            <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#F4F4F3"/>
          </svg>
        </div>
        <div class="lbl" style="color:#5F5F5D">128</div>
      </div>
      <!-- 64 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="width:64px;height:64px;border-radius:15px;background:#F4F4F3;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 48 48" style="width:37px;height:37px;color:#0B0B0C">
            <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
            <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
            <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="3.1" fill="#F4F4F3"/>
            <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#F4F4F3"/>
          </svg>
        </div>
        <div class="lbl" style="color:#5F5F5D">64</div>
      </div>
      <!-- 32 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:10px;background:#F4F4F3;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 48 48" style="width:24px;height:24px;color:#0B0B0C">
            <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/>
            <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
            <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
            <circle cx="24" cy="28.5" r="3.3" fill="#F4F4F3"/>
          </svg>
        </div>
        <div class="lbl" style="color:#5F5F5D">32</div>
      </div>
      <!-- home screen mock -->
      <div style="margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:64px;height:64px;border-radius:15px;background:#F4F4F3;display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 48 48" style="width:37px;height:37px;color:#0B0B0C">
              <path d="M17 21 V15 a7 7 0 0 1 14 0 V21" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
              <rect x="9" y="21" width="30" height="17" rx="5.5" fill="currentColor"/>
              <path d="M14.5 37 L11.5 43.2 L21 37.5 Z" fill="currentColor"/>
              <circle cx="24" cy="28" r="3.1" fill="#F4F4F3"/>
              <path d="M22.5 29.7 L21.7 34 h4.6 l-0.8 -4.3 Z" fill="#F4F4F3"/>
            </svg>
          </div>
          <div style="font-size:12px;color:#D8D8D6">Chat2Chat</div>
        </div>
        <div class="lbl" style="color:#5F5F5D">ON HOME SCREEN</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
