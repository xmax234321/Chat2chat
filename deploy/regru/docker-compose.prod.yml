# Production stack for REG.RU Cloud (Docker template VPS)
# Usage: docker compose -f deploy/regru/docker-compose.prod.yml --env-file deploy/regru/.env up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - chat2chat

  relay:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    expose:
      - "3847"
    environment:
      PORT: 3847
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN}}
      MESSAGE_TTL_MS: ${MESSAGE_TTL_MS:-86400000}
      BLOB_TTL_MS: ${BLOB_TTL_MS:-86400000}
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-536870912}
      DATA_DIR: /app/data
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-code@chat2chat.org}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-1.4.2}
      MIN_CLIENT_BUILD: ${MIN_CLIENT_BUILD:-50}
      ENFORCE_MIN_CLIENT_VERSION: ${ENFORCE_MIN_CLIENT_VERSION:-true}
    volumes:
      - relay_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3847/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat2chat

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CHAT2CHAT_SERVER: ${VITE_CHAT2CHAT_SERVER:-wss://${DOMAIN}/ws}
        VITE_CHAT2CHAT_HTTP: ${VITE_CHAT2CHAT_HTTP:-https://${DOMAIN}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - chat2chat
    profiles:
      - full

networks:
  chat2chat:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  relay_data:
